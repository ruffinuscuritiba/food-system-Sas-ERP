name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check logs right after live test order
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            echo "===== logs (5 min) — tudo, sem filtro ====="
            docker logs foodsaas-backend-backend-1 --since 5m 2>&1 | tail -150
