name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Read-only inspection of cash reconciliation data
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            set -e
            cat > /tmp/cash_audit.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();

            async function main() {
              const company = await prisma.company.findFirst({
                where: { name: { contains: 'Ruffinu', mode: 'insensitive' } },
                select: { id: true, name: true },
              });
              if (!company) { console.log('Empresa não encontrada'); return; }
              console.log('Empresa:', company.name, company.id);

              const cashes = await prisma.cash.findMany({
                where: { companyId: company.id },
                orderBy: { createdAt: 'desc' },
                take: 5,
              });

              for (const c of cashes) {
                console.log('\n--- Cash', c.id, '---');
                console.log('  isOpen:', c.isOpen, ' createdAt:', c.createdAt, ' closedAt:', c.closedAt);
                console.log('  openingValue:', c.openingValue.toString(), ' entries:', c.entries.toString(), ' exits:', c.exits.toString(), ' balance:', c.balance.toString());
                console.log('  declaredValue:', c.declaredValue?.toString(), ' systemValue:', c.systemValue?.toString(), ' difference:', c.difference?.toString());

                const cashOrders = await prisma.order.findMany({
                  where: { cashId: c.id, paymentMethod: 'CASH' },
                  select: { id: true, number: true, status: true, total: true, confirmedAt: true, cancelledAt: true, createdAt: true },
                  orderBy: { createdAt: 'asc' },
                });
                const confirmedTotal = cashOrders
                  .filter(o => !['PENDING', 'CANCELLED'].includes(o.status))
                  .reduce((s, o) => s + Number(o.total), 0);
                console.log('  Pedidos CASH vinculados a este caixa:', cashOrders.length, ' soma (nao pendente/cancelado):', confirmedTotal.toFixed(2));

                // Pedidos cujo confirmedAt é DEPOIS do caixa já ter sido fechado
                // (candidato a bug: cash.updateMany com isOpen:true não bate mais nada)
                if (c.closedAt) {
                  const lateConfirm = cashOrders.filter(o => o.confirmedAt && new Date(o.confirmedAt) > new Date(c.closedAt));
                  if (lateConfirm.length) {
                    console.log('  ⚠ Pedidos confirmados APÓS o fechamento deste caixa (possível perda de crédito):');
                    for (const o of lateConfirm) {
                      console.log('    #', o.number, ' total:', o.total.toString(), ' confirmedAt:', o.confirmedAt, ' status:', o.status);
                    }
                  }
                }
              }

              // Pedidos CASH sem cashId nenhum (não deveriam existir para canal PDV)
              const orphanCash = await prisma.order.findMany({
                where: { companyId: company.id, paymentMethod: 'CASH', cashId: null, status: { notIn: ['PENDING', 'CANCELLED'] } },
                select: { id: true, number: true, total: true, channel: true, createdAt: true, confirmedAt: true },
                orderBy: { createdAt: 'desc' },
                take: 20,
              });
              console.log('\n--- Pedidos CASH confirmados SEM cashId (', orphanCash.length, ') ---');
              for (const o of orphanCash) {
                console.log('  #', o.number, ' total:', o.total.toString(), ' channel:', o.channel, ' createdAt:', o.createdAt);
              }

              // OnlineOrder pagos em dinheiro (cardápio digital / totem) — nunca têm cashId hoje
              const onlineCash = await prisma.onlineOrder.findMany({
                where: { companyId: company.id, paymentMethod: 'CASH', orderStatus: { not: 'CANCELED' } },
                select: { id: true, total: true, orderStatus: true, createdAt: true, channel: true },
                orderBy: { createdAt: 'desc' },
                take: 20,
              });
              const onlineCashSum = onlineCash.reduce((s, o) => s + Number(o.total), 0);
              console.log('\n--- OnlineOrder pagos em CASH (cardápio/totem), últimos', onlineCash.length, '— soma:', onlineCashSum.toFixed(2), '---');
              for (const o of onlineCash) {
                console.log('  ', o.id, ' total:', o.total.toString(), ' status:', o.orderStatus, ' channel:', o.channel, ' createdAt:', o.createdAt);
              }
            }

            main().catch(e => console.error(e)).finally(() => prisma.$disconnect());
            JSEOF
            docker cp /tmp/cash_audit.js foodsaas-backend-backend-1:/app/cash_audit.js
            docker exec -w /app foodsaas-backend-backend-1 node cash_audit.js
            docker exec foodsaas-backend-backend-1 rm -f /app/cash_audit.js
            rm -f /tmp/cash_audit.js
