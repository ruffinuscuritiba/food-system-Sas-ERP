name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "── /opt listing ──"
            ls -la /opt/
            echo "── docker ps (todos os containers) ──"
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            echo "── docker networks ──"
            docker network ls
            echo "── traefik labels da rede proxy ──"
            docker network inspect proxy --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null || echo "sem rede proxy ou sem acesso"
