name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "── docker ps ──"
            docker ps --filter name=foodsaas-backend-backend-1
            echo "── logs (últimas 120 linhas) ──"
            docker logs --tail 120 foodsaas-backend-backend-1
            echo "── health interno (dentro do container) ──"
            docker exec foodsaas-backend-backend-1 wget -qO- http://localhost:3001/api/health || echo "wget falhou"
