name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check AI test reply content
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            cat > /tmp/check2.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            async function main() {
              const conv = await prisma.whatsappConversation.findFirst({
                where: { customerPhone: { contains: '41999997777' } },
                orderBy: { updatedAt: 'desc' },
              });
              if (!conv) { console.log('conversa nao encontrada'); return; }
              console.log('conv.id:', conv.id, 'mode:', conv.mode);
              const msgs = await prisma.whatsappMessage.findMany({
                where: { conversationId: conv.id },
                orderBy: { createdAt: 'desc' },
                take: 4,
              });
              for (const m of msgs) console.log(m.role, '|', m.content);
            }
            main().catch(e=>console.error(e)).finally(()=>prisma.$disconnect());
            JSEOF
            docker cp /tmp/check2.js foodsaas-backend-backend-1:/app/check2.js
            docker exec -w /app foodsaas-backend-backend-1 node check2.js
            docker exec foodsaas-backend-backend-1 rm -f /app/check2.js

            echo ""
            echo "===== logs recentes (2 min) ====="
            docker logs foodsaas-backend-backend-1 --since 2m 2>&1 | tail -40
