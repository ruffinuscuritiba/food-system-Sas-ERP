name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "── docker-compose.yml do scc-app ──"
            cat /docker/saas-control-center/docker-compose.yml
            echo "── ls do diretório ──"
            ls -la /docker/saas-control-center/
            echo "── .env presente? (só nomes de chave, sem valor) ──"
            [ -f /docker/saas-control-center/.env ] && cut -d= -f1 /docker/saas-control-center/.env || echo "sem .env"
