name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "── /docker listing ──"
            ls -la /docker/ 2>/dev/null
            echo "── containers com nome moda/oficina/sbe ──"
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}" | grep -iE "moda|oficina|sbe"
            echo "── compose files de cada um, se existirem ──"
            for d in moda-erp moda oficina oficina-eletrica-erp sistema-oficina saude-beleza-erp sbe; do
              if [ -f "/docker/$d/docker-compose.yml" ]; then
                echo "=== /docker/$d/docker-compose.yml ==="
                cat "/docker/$d/docker-compose.yml"
              fi
            done
            echo "── labels do container moda-backend ──"
            docker inspect moda-backend --format '{{json .Config.Labels}}' 2>/dev/null | tr ',' '\n' | grep -i "rule\|network"
            echo "── labels do container oficina backend ──"
            docker inspect oficina-eletrica-erp-backend-1 --format '{{json .Config.Labels}}' 2>/dev/null | tr ',' '\n' | grep -i "rule\|network"
            echo "── labels do sbe-frontend ──"
            docker inspect sbe-frontend --format '{{json .Config.Labels}}' 2>/dev/null | tr ',' '\n' | grep -i "rule\|network"
