name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Fix Ruffinu's aiProvider + check notification logs
    runs-on: ubuntu-latest
    steps:
      - name: Inspect + targeted fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            set -e
            cat > /tmp/wa_fix.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();

            async function main() {
              const company = await prisma.company.findFirst({
                where: { name: { contains: 'Ruffinu', mode: 'insensitive' } },
                select: { id: true, name: true },
              });
              if (!company) { console.log('Empresa não encontrada'); return; }

              const conn = await prisma.whatsappConnection.findFirst({
                where: { companyId: company.id, isActive: true },
                orderBy: { createdAt: 'desc' },
              });
              if (!conn) { console.log('Conexão ativa não encontrada'); return; }

              const before = await prisma.whatsappAiSettings.findUnique({ where: { connectionId: conn.id } });
              console.log('ANTES: aiProvider=', before?.aiProvider, ' aiModel=', before?.aiModel);

              const updated = await prisma.whatsappAiSettings.update({
                where: { connectionId: conn.id },
                data: { aiProvider: 'CLAUDE', aiModel: 'claude-haiku-4-5-20251001' },
              });
              console.log('DEPOIS: aiProvider=', updated.aiProvider, ' aiModel=', updated.aiModel);
            }

            main().catch(e => console.error(e)).finally(() => prisma.$disconnect());
            JSEOF
            docker cp /tmp/wa_fix.js foodsaas-backend-backend-1:/app/wa_fix.js
            docker exec -w /app foodsaas-backend-backend-1 node wa_fix.js
            docker exec foodsaas-backend-backend-1 rm -f /app/wa_fix.js
            rm -f /tmp/wa_fix.js

            echo ""
            echo "===== logs (24h) — notificação de status de pedido ====="
            docker logs foodsaas-backend-backend-1 --since 24h 2>&1 | grep -iE "notificad|Confirmação enviada|dispatch error|Evolution dispatch|OrderNotificationService|sem conexão whatsapp ativa" | tail -60 || echo "(sem match)"
