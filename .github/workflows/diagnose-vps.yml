name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            cat > /tmp/c.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            async function main() {
              const cats = await prisma.category.findMany({
                where: { companyId: 'demo-delivery-001' },
                select: { id: true, name: true, color: true },
              });
              console.log('marmitaria categories:', JSON.stringify(cats));
              const prods = await prisma.product.count({ where: { companyId: 'demo-delivery-001' } });
              console.log('marmitaria products count:', prods);
            }
            main().catch(e=>console.error(e)).finally(()=>prisma.$disconnect());
            JSEOF
            docker cp /tmp/c.js foodsaas-backend-backend-1:/app/c.js
            docker exec -w /app foodsaas-backend-backend-1 node c.js
            docker exec foodsaas-backend-backend-1 rm -f /app/c.js
