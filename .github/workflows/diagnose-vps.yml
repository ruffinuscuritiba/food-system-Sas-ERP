name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            cat > /tmp/c.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            async function main() {
              const niches = ['Marmitarias', 'Pizzaria', 'Restaurantes', 'Hamburgueria'];
              for (const n of niches) {
                const count = await prisma.pageVisit.count({ where: { page: `demo:${n}` } });
                console.log('visits demo:' + n + ' =', count);
              }
              const totalLeads = await prisma.lead.count();
              console.log('total leads:', totalLeads);
              const byPlan = await prisma.lead.groupBy({ by: ['recommendedPlan', 'status'], _count: true });
              console.log('leads by plan+status:', JSON.stringify(byPlan));
              const companies = await prisma.company.findMany({
                where: { businessSegment: { not: 'RESTAURANTE' }, email: { not: null } },
                select: { id: true, name: true, businessSegment: true, subscriptionStatus: true, createdAt: true },
                orderBy: { createdAt: 'desc' },
                take: 20,
              });
              console.log('non-restaurante companies:', JSON.stringify(companies));
            }
            main().catch(e=>console.error(e)).finally(()=>prisma.$disconnect());
            JSEOF
            docker cp /tmp/c.js foodsaas-backend-backend-1:/app/c.js
            docker exec -w /app foodsaas-backend-backend-1 node c.js
            docker exec foodsaas-backend-backend-1 rm -f /app/c.js
