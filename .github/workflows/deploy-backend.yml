name: Deploy Backend → VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy no VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 600s
          script: |
            set -e

            echo "▶ Atualizando repositório local..."
            cd /root/food-system-Sas-ERP && git pull origin main --ff-only || {
              echo "⚠️  Pull falhou, tentando recriar clone..."
              cd /root && rm -rf food-system-Sas-ERP && \
              git clone https://github.com/ruffinuscuritiba/food-system-Sas-ERP.git
              cd food-system-Sas-ERP
            }

            echo "▶ Buildando imagem nova..."
            cd /root/food-system-Sas-ERP && \
            docker compose build backend

            echo "▶ Recriando container com imagem nova..."
            docker rm -f foodsaas-backend 2>/dev/null || true
            docker run -d --name foodsaas-backend \
              --network food-system-sas-erp_default \
              -p 3001:3001 \
              --env-file /root/food-system-Sas-ERP/.env \
              food-system-sas-erp-backend:latest \
              node dist/main

            echo "▶ Conectando à rede proxy (Traefik )..."
            docker network connect proxy foodsaas-backend 2>/dev/null || true

            echo "▶ Aguardando health check..."
            sleep 15
            STATUS=$(curl -sf "http://localhost:3001/api/health" | grep -o '"status":"ok"' || echo "pending" )
            echo "  Health: $STATUS"

            docker ps --filter "name=foodsaas-backend" --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deploy concluído!"
