name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check notification logs (72h) + order timestamps
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            echo "===== logs (72h) — notificação de status de pedido ====="
            docker logs foodsaas-backend-backend-1 --since 72h 2>&1 | grep -iE "notificad|Confirmação enviada|dispatch error|Evolution dispatch|OrderNotificationService|sem conexão whatsapp ativa|findActiveConnection" | tail -100 || echo "(sem match)"
            echo ""
            echo "===== timestamp atual do container (pra calibrar janela) ====="
            docker exec foodsaas-backend-backend-1 date -u
