name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Customer vs Order.customerPhone linkage
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "── labels do container scc-app (Traefik) ──"
            docker inspect scc-app --format '{{json .Config.Labels}}' | tr ',' '\n'
            echo "── procurando docker-compose do scc-app no filesystem ──"
            find / -maxdepth 4 -iname "*scc*" -not -path "*/proc/*" 2>/dev/null
            find / -maxdepth 4 -iname "*control-center*" -not -path "*/proc/*" 2>/dev/null
            echo "── /root listing ──"
            ls -la /root/ 2>/dev/null
            echo "── image build date ──"
            docker inspect scc-app --format 'created={{.Created}} image={{.Image}}'
            docker inspect scc-app:latest --format 'imageCreated={{.Created}}'
