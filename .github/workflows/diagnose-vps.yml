name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Read-only inspection of WhatsApp AI state
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            set -e
            cat > /tmp/wa_audit.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();

            async function main() {
              const company = await prisma.company.findFirst({
                where: { name: { contains: 'Ruffinu', mode: 'insensitive' } },
                select: { id: true, name: true, businessHours: true },
              });
              if (!company) { console.log('Empresa não encontrada'); return; }
              console.log('Empresa:', company.name, company.id);
              console.log('businessHours:', JSON.stringify(company.businessHours));

              const connections = await prisma.whatsappConnection.findMany({
                where: { companyId: company.id },
                orderBy: { createdAt: 'desc' },
              });
              console.log('\n--- WhatsappConnection (', connections.length, ') ---');
              for (const c of connections) {
                console.log('  id:', c.id, ' provider:', c.provider, ' isActive:', c.isActive, ' instanceName:', c.instanceName, ' createdAt:', c.createdAt);

                const settings = await prisma.whatsappAiSettings.findUnique({
                  where: { connectionId: c.id },
                });
                if (!settings) {
                  console.log('    ⚠ SEM WhatsappAiSettings (settings=null)');
                } else {
                  console.log('    settings: aiProvider=', settings.aiProvider, ' mode=', settings.mode, ' isActive=', settings.isActive,
                    ' businessHoursStart=', settings.businessHoursStart, ' businessHoursEnd=', settings.businessHoursEnd,
                    ' businessHoursDays=', settings.businessHoursDays);
                }
              }

              // Últimas conversas e se estão em modo HUMAN (bloqueia resposta da IA)
              const conversations = await prisma.whatsappConversation.findMany({
                where: { companyId: company.id },
                orderBy: { updatedAt: 'desc' },
                take: 10,
              });
              console.log('\n--- Últimas 10 WhatsappConversation ---');
              for (const conv of conversations) {
                console.log('  id:', conv.id, ' customerPhone:', conv.customerPhone, ' mode:', conv.mode, ' aiDisabled:', conv.aiDisabled, ' lastMessageAt:', conv.lastMessageAt, ' updatedAt:', conv.updatedAt);
              }

              // Últimas mensagens (USER vs ASSISTANT) — ver se USER manda e ASSISTANT nunca responde
              const messages = await prisma.whatsappMessage.findMany({
                where: { conversation: { companyId: company.id } },
                orderBy: { createdAt: 'desc' },
                take: 20,
                select: { role: true, content: true, createdAt: true, conversationId: true },
              });
              console.log('\n--- Últimas 20 WhatsappMessage (qualquer conversa) ---');
              for (const m of messages) {
                const preview = (m.content || '').slice(0, 60).replace(/\n/g, ' ');
                console.log('  ', m.createdAt.toISOString(), ' role:', m.role, ' conv:', m.conversationId, ' :', preview);
              }

              console.log('\n--- Env vars relevantes (presença, nunca valor) ---');
              console.log('  EVOLUTION_API_URL set:', !!process.env.EVOLUTION_API_URL);
              console.log('  EVOLUTION_API_KEY set:', !!process.env.EVOLUTION_API_KEY);
              console.log('  EVOLUTION_INSTANCE_NAME:', process.env.EVOLUTION_INSTANCE_NAME || '(vazio)');
              console.log('  ANTHROPIC_API_KEY set:', !!process.env.ANTHROPIC_API_KEY);
              console.log('  GEMINI_API_KEY set:', !!process.env.GEMINI_API_KEY);

              // Pedidos recentes — pra checar se updateKitchenStatus deveria ter notificado
              const recentOrders = await prisma.order.findMany({
                where: { companyId: company.id, status: { in: ['CONFIRMED', 'PREPARING', 'READY', 'OUT_FOR_DELIVERY', 'DELIVERED'] } },
                orderBy: { updatedAt: 'desc' },
                take: 5,
                select: { id: true, number: true, status: true, customerPhone: true, channel: true, updatedAt: true },
              });
              console.log('\n--- Últimos 5 pedidos com status mudado (candidatos a notificação) ---');
              for (const o of recentOrders) {
                console.log('  #', o.number, ' status:', o.status, ' customerPhone:', o.customerPhone, ' channel:', o.channel, ' updatedAt:', o.updatedAt);
              }
            }

            main().catch(e => console.error(e)).finally(() => prisma.$disconnect());
            JSEOF
            docker cp /tmp/wa_audit.js foodsaas-backend-backend-1:/app/wa_audit.js
            docker exec -w /app foodsaas-backend-backend-1 node wa_audit.js
            docker exec foodsaas-backend-backend-1 rm -f /app/wa_audit.js
            rm -f /tmp/wa_audit.js

            echo ""
            echo "===== logs recentes do backend (filtrando whatsapp/AI/erro) ====="
            docker logs foodsaas-backend-backend-1 --since 2h 2>&1 | grep -iE "whatsapp|\[ai\]|\[wh\]|evolution|error" | tail -80 || echo "(sem match)"
