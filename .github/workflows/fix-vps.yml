name: Restore FoodSaaS backend (Traefik labels)

on:
  workflow_dispatch:

jobs:
  restore:
    name: Rebuild from real compose project and verify routing
    runs-on: ubuntu-latest
    steps:
      - name: Restore via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 300s
          script: |
            set -e
            echo "===== full real compose file (/opt/foodsaas-backend) ====="
            cat /opt/foodsaas-backend/docker-compose.yml

            echo ""
            echo "===== removing rogue label-less container ====="
            docker rm -f foodsaas-backend 2>/dev/null || echo "(already gone)"

            echo ""
            echo "===== rebuilding from real compose project ====="
            cd /opt/foodsaas-backend
            docker compose build backend
            docker compose up -d --force-recreate backend

            echo ""
            echo "===== waiting for health ====="
            sleep 15
            docker ps --filter "name=foodsaas-backend" --format "table {{.Names}}\t{{.Status}}"
            docker inspect foodsaas-backend --format 'Labels: {{json .Config.Labels}}'
            echo ""
            echo "internal health:"
            curl -sf http://localhost:3001/api/health || echo "FAILED internal"
