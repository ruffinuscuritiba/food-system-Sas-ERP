name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Final sanity check after deploy
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "===== marcador do fix (provisionConnection) no dist ====="
            docker exec foodsaas-backend-backend-1 sh -c "grep -c 'provisionAmbiente' dist/modules/whatsapp-ai/whatsapp-ai.service.js"
            echo ""
            cat > /tmp/check.js << 'JSEOF'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            async function main() {
              const s = await prisma.whatsappAiSettings.findFirst({
                where: { connection: { company: { name: { contains: 'Ruffinu', mode: 'insensitive' } }, isActive: true } },
              });
              console.log('aiProvider:', s?.aiProvider, ' aiModel:', s?.aiModel);
            }
            main().catch(e=>console.error(e)).finally(()=>prisma.$disconnect());
            JSEOF
            docker cp /tmp/check.js foodsaas-backend-backend-1:/app/check.js
            docker exec -w /app foodsaas-backend-backend-1 node check.js
            docker exec foodsaas-backend-backend-1 rm -f /app/check.js
