# ─────────────────────────────────────────────────────────────────────────────
# CD — Deploy automático do backend para o VPS Hostinger
#
# Dispara após qualquer push em `main` que toque arquivos do backend.
# Faz SSH no VPS, atualiza o repositório local, reconstrói a imagem Docker
# e recria o container — garante que a nova imagem seja realmente aplicada.
#
# Pré-requisito no VPS:
#   - O projeto deve existir em /root/food-system-Sas-ERP
#   - docker-compose.yml configurado com o serviço "backend"
#
# Secrets obrigatórios (Settings → Secrets → Actions no GitHub):
#   VPS_HOST      → srv1747711.hstgr.cloud
#   VPS_USER      → root
#   VPS_SSH_KEY   → chave privada ed25519 (ver CLAUDE.md para instruções)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend → VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Só um deploy por vez — cancela run anterior se já houver um em andamento
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy no VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 600s
          script: |
            set -e

            echo "▶ Atualizando repositório local..."
            cd /root/food-system-Sas-ERP && git pull origin main --ff-only || {
              echo "⚠️  Pull falhou, tentando recriar clone..."
              cd /root && rm -rf food-system-Sas-ERP && \
              git clone https://github.com/ruffinuscuritiba/food-system-Sas-ERP.git
              cd food-system-Sas-ERP
            }

            echo "▶ Buildando imagem e recriando container..."
            docker compose build backend && \
            docker compose up -d --force-recreate --no-deps backend

            echo "▶ Aguardando health check..."
            sleep 8
            STATUS=$(curl -sf "http://localhost:3001/api/health" | grep -o '"status":"ok"' || echo "pending")
            echo "  Health: $STATUS"

            docker compose ps
            echo "✅ Deploy concluído!"
