name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Verify compiled code contains notification logic
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH (no changes made)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 120s
          script: |
            echo "===== marcadores no dist/modules/orders/orders.service.js ====="
            docker exec foodsaas-backend-backend-1 sh -c "grep -c 'Confirmação enviada' dist/modules/orders/orders.service.js; grep -c 'notifyStatusChange' dist/modules/orders/orders.service.js; grep -c 'orderNotificationService' dist/modules/orders/orders.service.js"
            echo ""
            echo "===== image build date ====="
            docker inspect foodsaas-backend-backend-1 --format '{{.Created}}'
            echo ""
            echo "===== git commit atual no container (se disponivel) ====="
            docker exec foodsaas-backend-backend-1 sh -c "cat dist/BUILD_ID 2>/dev/null || echo none"
